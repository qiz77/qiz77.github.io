<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe0c4"/>
      <stop offset="100%" stop-color="#f5c9a0"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="300" height="300" fill="url(#bgGrad)"/>
  <rect width="300" height="300" fill="url(#glow)"/>

  <!-- 西服领/肩部 -->
  <path d="M 40 300 Q 40 220 85 195 L 130 210 Q 150 235 170 210 L 215 195 Q 260 220 260 300 Z" fill="url(#suitGrad)"/>

  <!-- 衬衫三角区 -->
  <path d="M 130 210 L 150 260 L 170 210 Q 160 200 150 200 Q 140 200 130 210 Z" fill="url(#shirtGrad)"/>

  <!-- 领带 -->
  <path d="M 146 215 L 154 215 L 160 255 L 150 270 L 140 255 Z" fill="#2563eb"/>
  <path d="M 143 210 Q 150 205 157 210 L 160 220 L 140 220 Z" fill="#1d4ed8"/>

  <!-- 脖子 -->
  <path d="M 132 170 L 132 205 Q 150 220 168 205 L 168 170 Z" fill="url(#faceGrad)"/>
  <path d="M 132 195 Q 150 210 168 195" stroke="#d4a574" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- 头部 -->
  <ellipse cx="150" cy="125" rx="52" ry="62" fill="url(#faceGrad)"/>

  <!-- 耳朵 -->
  <ellipse cx="98" cy="128" rx="8" ry="13" fill="url(#faceGrad)"/>
  <ellipse cx="202" cy="128" rx="8" ry="13" fill="url(#faceGrad)"/>

  <!-- 头发 -->
  <path d="M 100 105 Q 95 70 130 58 Q 150 50 175 60 Q 205 70 205 108 Q 205 95 195 92 Q 180 85 168 88 Q 155 82 140 88 Q 120 85 110 95 Q 100 98 100 105 Z" fill="#1a1a1a"/>
  <path d="M 100 105 Q 98 130 102 145 Q 95 125 100 105 Z" fill="#1a1a1a"/>
  <path d="M 200 105 Q 202 130 198 145 Q 205 125 200 105 Z" fill="#1a1a1a"/>

  <!-- 眉毛 -->
  <path d="M 120 118 Q 130 113 140 118" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 160 118 Q 170 113 180 118" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 眼睛 -->
  <ellipse cx="130" cy="130" rx="4" ry="5" fill="#1a1a1a"/>
  <ellipse cx="170" cy="130" rx="4" ry="5" fill="#1a1a1a"/>
  <circle cx="131" cy="129" r="1.2" fill="#ffffff"/>
  <circle cx="171" cy="129" r="1.2" fill="#ffffff"/>

  <!-- 鼻子 -->
  <path d="M 148 138 Q 146 152 150 158 Q 154 160 155 156" stroke="#c49575" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- 嘴巴 -->
  <path d="M 138 172 Q 150 178 162 172" stroke="#8b4513" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 脸颊红晕 -->
  <ellipse cx="122" cy="150" rx="8" ry="5" fill="#ff9999" opacity="0.25"/>
  <ellipse cx="178" cy="150" rx="8" ry="5" fill="#ff9999" opacity="0.25"/>
</svg>
